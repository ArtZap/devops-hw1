server {
    listen 80 default_server;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Managed-By "terraform" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
