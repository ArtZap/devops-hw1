# "Security group" of the VM on ufw: deny inbound by default, SSH from any
# address but rate-limited (login is key-only, see role common),
# public_tcp_ports for everyone.

- name: Validate public ports
  ansible.builtin.assert:
    that:
      - 22 not in public_tcp_ports
    fail_msg: SSH is managed by its own rate-limited rule; keep 22 out of public_tcp_ports.
    quiet: true

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default policies
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

# limit = deny an address that opens 6+ connections within 30 seconds:
# keeps password-less brute force bots from hammering sshd.
- name: Allow SSH from anywhere, rate-limited
  community.general.ufw:
    rule: limit
    proto: tcp
    to_port: "22"
    comment: ssh

- name: Allow public service ports
  community.general.ufw:
    rule: allow
    proto: tcp
    to_port: "{{ item | string }}"
    comment: public
  loop: "{{ public_tcp_ports }}"

# The ufw module only adds rules, so rules this role no longer wants are
# removed explicitly. Only rules carrying our comments are touched; this runs
# after the adds, so SSH stays reachable the whole time.
- name: Read rules managed by this role
  ansible.builtin.command: ufw show added
  register: ufw_added
  changed_when: false
  check_mode: false

- name: Remove per-address SSH rules
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    to_port: "22"
    delete: true
  loop: >-
    {{ ufw_added.stdout_lines
       | select('match', "^ufw allow from \S+ to any port 22 proto tcp comment 'ssh-admin'$")
       | map('regex_replace', '^ufw allow from (\S+) .*$', '\1') | list }}

- name: Remove public rules for ports no longer in public_tcp_ports
  community.general.ufw:
    rule: allow
    proto: tcp
    to_port: "{{ item }}"
    delete: true
  loop: >-
    {{ ufw_added.stdout_lines
       | select('match', "^ufw allow \d+/tcp comment 'public'$")
       | map('regex_replace', '^ufw allow (\d+)/tcp .*$', '\1')
       | difference(public_tcp_ports | map('string')) }}

- name: Enable ufw
  community.general.ufw:
    state: enabled
