# "Security group" of the VM on ufw: deny inbound by default, SSH only from
# admin_cidrs, public_tcp_ports for everyone.

# A wrong list here locks us out of SSH once ufw is enabled, so check it first.
- name: Validate admin_cidrs
  ansible.builtin.assert:
    that:
      - admin_cidrs | length > 0
      - admin_cidrs | select('match', '^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$') | list | length == admin_cidrs | length
      - admin_cidrs | map('split', '/') | map('last') | map('int') | min >= 24
      - 22 not in public_tcp_ports
    fail_msg: >-
      admin_cidrs must be a non-empty list of /24-or-narrower networks
      (host_vars/vm1/admin.yml), and port 22 must not be public.
    quiet: true

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default policies
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH from admin networks
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    to_port: "22"
    comment: ssh-admin
  loop: "{{ admin_cidrs }}"

- name: Allow public service ports
  community.general.ufw:
    rule: allow
    proto: tcp
    to_port: "{{ item | string }}"
    comment: public
  loop: "{{ public_tcp_ports }}"

# The ufw module only adds rules. Without this, an address dropped from
# admin_cidrs or a port dropped from public_tcp_ports would stay open.
# Only rules carrying our comments are touched; runs after the adds, so the
# current SSH rule is never missing.
- name: Read rules managed by this role
  ansible.builtin.command: ufw show added
  register: ufw_added
  changed_when: false
  check_mode: false

- name: Remove SSH rules for addresses no longer in admin_cidrs
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    to_port: "22"
    delete: true
  # ufw prints a /32 as a bare address.
  loop: >-
    {{ ufw_added.stdout_lines
       | select('match', "^ufw allow from \S+ to any port 22 proto tcp comment 'ssh-admin'$")
       | map('regex_replace', '^ufw allow from (\S+) .*$', '\1')
       | difference(admin_cidrs | map('regex_replace', '/32$', '')) }}

- name: Remove public rules for ports no longer in public_tcp_ports
  community.general.ufw:
    rule: allow
    proto: tcp
    to_port: "{{ item }}"
    delete: true
  loop: >-
    {{ ufw_added.stdout_lines
       | select('match', "^ufw allow \d+/tcp comment 'public'$")
       | map('regex_replace', '^ufw allow (\d+)/tcp .*$', '\1')
       | difference(public_tcp_ports | map('string')) }}

# Rules for our SSH address are already in place, so the session survives.
- name: Enable ufw
  community.general.ufw:
    state: enabled
