- name: Create deployment user
  ansible.builtin.user:
    name: "{{ deployer_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true

- name: Authorize deployer SSH key
  ansible.posix.authorized_key:
    user: "{{ deployer_user }}"
    key: "{{ lookup('ansible.builtin.file', deployer_pubkey_path | expanduser) }}"
    exclusive: true

- name: Allow passwordless sudo for deployer
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deployer_user }}"
    content: "{{ deployer_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# sshd uses the first value it reads, and the lab drop-in (01-lab.conf)
# enables passwords, so this file must sort before it.
- name: Harden sshd (key-only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # Managed by Ansible (role common)
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
