# Bind-mounted files are not part of the compose hash, so restart explicitly.
- name: Restart compose project
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: restarted

- name: Reload host nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when: ansible_facts.services['nginx.service'].state | default('') == 'running'
